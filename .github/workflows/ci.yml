name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deep_reverse
          POSTGRES_PASSWORD: deep_reverse
          POSTGRES_DB: deep_reverse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deep_reverse"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://deep_reverse:deep_reverse@localhost:5432/deep_reverse
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/api/requirements.txt
      - run: pip install ruff mypy pytest pytest-asyncio
      - name: Lint
        run: ruff check apps/api packages
      - name: Run migrations
        run: cd packages/db && alembic upgrade head
      - name: Tests
        run: pytest tests/ -q
        continue-on-error: false

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded secrets in web bundle sources
        run: |
          if grep -rE "(sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16})" apps/web --include="*.ts" --include="*.tsx"; then
            echo "Possible hardcoded secret found in frontend source"; exit 1
          fi
