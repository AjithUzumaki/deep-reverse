name: deep-reverse

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deep_reverse
      POSTGRES_PASSWORD: deep_reverse
      POSTGRES_DB: deep_reverse
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deep_reverse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: deep_reverse
      MINIO_ROOT_PASSWORD: deep_reverse_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    volumes:
      - ollama_data:/root/.ollama

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    working_dir: /srv/packages/db
    entrypoint: ["alembic", "upgrade", "head"]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/api:/srv/apps/api
      - ./packages:/srv/packages
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker:/srv/apps/worker
      - ./packages:/srv/packages

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:8000
    volumes:
      - ./apps/web:/srv
      - web_node_modules:/srv/node_modules

volumes:
  db_data:
  minio_data:
  ollama_data:
  web_node_modules:
